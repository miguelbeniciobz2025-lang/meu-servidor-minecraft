name: Minecraft Bedrock Server 24/7

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: bedrock-server
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip jq libssl-dev

      - name: Download and Setup Bedrock Server
        run: |
          mkdir -p server && cd server
          URL=$(curl -fsSL -A "Mozilla/5.0" \
            https://net-secondary.web.minecraft-services.net/api/v1.0/download/links \
            | jq -r '.result.links[] | select(.downloadType=="serverBedrockLinux") | .downloadUrl')
          echo "URL: $URL"
          [ -n "$URL" ] || { echo "Não encontrei o URL de download"; exit 1; }
          curl -fL -A "Mozilla/5.0" -o bedrock-server.zip "$URL"
          SIZE=$(stat -c%s bedrock-server.zip)
          echo "Tamanho: $SIZE bytes"
          [ "$SIZE" -gt 1000000 ] || { echo "Download inválido:"; head -c 200 bedrock-server.zip; exit 1; }
          unzip -o bedrock-server.zip
          chmod +x bedrock_server

      - name: Restore World
        uses: actions/cache/restore@v4
        with:
          path: |
            server/worlds
            server/server.properties
            server/allowlist.json
            server/permissions.json
          key: bedrock-world-${{ github.run_id }}
          restore-keys: bedrock-world-

      - name: Setup Playit.gg
        run: |
          curl -SsL https://playit-cloud.github.io/ppa/key.gpg | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/playit.gpg > /dev/null
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/playit.gpg] https://playit-cloud.github.io/ppa/data ./" | sudo tee /etc/apt/sources.list.d/playit-cloud.list
          sudo apt-get update && sudo apt-get install -y playit
          nohup playit --secret "${{ secrets.PLAYIT_SECRET }}" > playit.log 2>&1 &
          sleep 5
          cat playit.log

      - name: Start Minecraft Bedrock Server
        run: |
          cd server
          export LD_LIBRARY_PATH=.
          tail -f /dev/null | timeout -s INT 20400 ./bedrock_server || true

      - name: Save World
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            server/worlds
            server/server.properties
            server/allowlist.json
            server/permissions.json
          key: bedrock-world-${{ github.run_id }}

      - name: Restart Workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
        
