name: Minecraft Bedrock Server 24/7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java / Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Start Minecraft Bedrock Server
        run: |
          echo "A ligar o servidor de Minecraft Bedrock..."
          # Coloca aqui o comando que inicia o teu servidor de Minecraft (ex: ./bedrock_server) se necessário, ou deixa a correr.

      - name: Setup Playit.gg
        env:
          SECRET_KEY: ${{ secrets.PLAYIT_SECRET }}
        run: |
          curl -SsL https://playit-cloud.github.io/get-playit/install.sh | sudo sh
          playit daemon &

      - name: Keep Server Running
        run: |
          # Mantém o workflow ativo em segundo plano para o servidor não desligar
          while true; do
            sleep 60
          done
          
